{% extends "base.html" %}

{% block content %}

<div class="edit-container">

    <h1>Edit Screenshot</h1>

    <p>
        Update the title or comment for your screenshot.
    </p>


    <!-- CURRENT SCREENSHOT -->

    <div class="edit-image-container">

        {% if screenshot.image_url %}

            <img
                src="{{ screenshot.image_url }}"
                alt="{{ screenshot.title }}"
                class="edit-image"
            >

        {% else %}

            <div class="image-placeholder">

                <span>🎮</span>

                <p>
                    Screenshot image storage
                    is being connected.
                </p>

            </div>

        {% endif %}

    </div>


    <!-- EDIT FORM -->

    <form
        method="POST"
        action="{{ url_for(
            'edit',
            screenshot_id=screenshot.id
        ) }}"
    >

        <div class="form-group">

            <label for="title">
                Screenshot Title
            </label>

            <input
                type="text"
                id="title"
                name="title"
                value="{{ screenshot.title }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="comment">
                Comment
            </label>

            <textarea
                id="comment"
                name="comment"
                rows="5"
                placeholder="Tell us about this screenshot..."
            >{{ screenshot.comment or '' }}</textarea>

        </div>


        <button type="submit">
            Save Changes
        </button>


        <a
            href="{{ url_for('index') }}"
            class="button button-blue"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
