{% extends "base.html" %}

{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">
            👾
        </div>

        <p class="auth-label">
            CREATE PLAYER
        </p>

        <h1>
            Join MikeyIan
        </h1>

        <p class="auth-subtitle">
            Create your account and start sharing
            your gaming screenshots.
        </p>

        <form method="POST">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required
                >

            </div>

            <button
                type="submit"
                class="auth-submit"
            >
                CREATE ACCOUNT
            </button>

        </form>

        <div class="auth-bottom">

            <p>
                Already have an account?
            </p>

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </div>

    </div>

</section>

{% endblock %}
