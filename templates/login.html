{% extends "base.html" %}

{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">
            🎮
        </div>

        <p class="auth-label">
            PLAYER LOGIN
        </p>

        <h1>
            Welcome Back
        </h1>

        <p class="auth-subtitle">
            Login to MikeyIan Screen Shot
        </p>

        <form method="POST">

            <div class="form-group">
                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button
                type="submit"
                class="auth-submit"
            >
                LOGIN
            </button>

        </form>

        <div class="auth-bottom">

            <p>
                New player?
            </p>

            <a href="{{ url_for('register') }}">
                Create an account
            </a>

        </div>

    </div>

</section>

{% endblock %}
