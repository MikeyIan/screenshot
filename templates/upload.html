{% extends "base.html" %}

{% block content %}

<div class="upload-container">

    <h1>Upload Screenshot</h1>

    <p>Share your favorite gaming screenshot.</p>

    <form
        method="POST"
        action="{{ url_for('upload') }}"
        enctype="multipart/form-data"
    >

        <div class="form-group">
            <label for="title">Screenshot Title</label>

            <input
                type="text"
                id="title"
                name="title"
                placeholder="Enter screenshot title"
                required
            >
        </div>

        <div class="form-group">
            <label for="comment">Comment</label>

            <textarea
                id="comment"
                name="comment"
                placeholder="Tell us about this screenshot..."
                rows="5"
            ></textarea>
        </div>

        <div class="form-group">
            <label for="image">Choose Screenshot</label>

            <input
                type="file"
                id="image"
                name="image"
                accept=".png,.jpg,.jpeg,.gif,.webp"
                required
            >
        </div>

        <button type="submit">
            Upload Screenshot
        </button>

    </form>

</div>

{% endblock %}
