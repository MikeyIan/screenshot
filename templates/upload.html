{% extends "base.html" %}

{% block content %}

<section class="upload-page">

    <div class="upload-card">

        <div class="upload-header">

            <div class="auth-icon">
                📸
            </div>

            <p class="auth-label">
                SHARE YOUR GAME
            </p>

            <h1>
                Upload Screenshot
            </h1>

            <p>
                Share one of your favorite
                gaming moments with the community.
            </p>

        </div>


        <form
            method="POST"
            enctype="multipart/form-data"
        >

            <div class="form-group">

                <label for="title">
                    Screenshot Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Example: Snake begins the mission"
                    required
                >

            </div>


            <div class="form-group">

                <label for="comment">
                    Description
                </label>

                <textarea
                    id="comment"
                    name="comment"
                    rows="5"
                    placeholder="Tell everyone about this screenshot..."
                ></textarea>

            </div>


            <div class="form-group">

                <label for="image">
                    Screenshot
                </label>

                <div class="file-upload-box">

                    <div class="file-upload-icon">
                        🖼️
                    </div>

                    <p>
                        Choose your gaming screenshot
                    </p>

                    <span>
                        PNG • JPG • JPEG • GIF • WEBP
                    </span>

                    <input
                        type="file"
                        id="image"
                        name="image"
                        accept=".png,.jpg,.jpeg,.gif,.webp"
                        required
                    >

                </div>

            </div>


            <button
                type="submit"
                class="auth-submit"
            >
                ⬆ UPLOAD SCREENSHOT
            </button>

        </form>


        <a
            href="{{ url_for('index') }}"
            class="back-gallery"
        >
            ← Back to Gallery
        </a>

    </div>

</section>

{% endblock %}
